[package]
name = "kernel"
version = "0.6.0"
edition = "2024"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true

[lib]
name = "kernel"
path = "src/kernel.rs"
crate-type = ["staticlib"]
test = false
bench = false

[dependencies]
kfs-abi = { path = "abi" }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = { version = "0.11.1", default-features = false }

[build-dependencies]
rustc-demangle = "0.1.28"
